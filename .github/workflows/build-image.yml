name: build-image

on:
  push:
    branches:
      - main
    tags:
      - "*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the bootc image with buildah
        # bootc images must be built with buildah (not docker) to keep the OCI layout intact.
        # Use a plain local tag (no registry prefix) so the verify step can never
        # accidentally pull a stale image from the registry instead of checking
        # the image we just built.
        run: |
          buildah login ghcr.io -u "${{ github.actor }}" --password-stdin <<< "${{ secrets.GITHUB_TOKEN }}"
          buildah build --label io.bootc.install=1 -f Containerfile -t immutabletesting:latest .

      - name: Verify the keycloak pod units are in the image
        # Make sure the quadlet units shipped and still generate systemd services,
        # so we don't push an image whose keycloak pod silently never starts.
        # --pull=never guarantees we inspect the locally built image above.
        run: |
          ctr=$(buildah from --pull=never immutabletesting:latest)
          buildah run "$ctr" -- sh -c '
            for f in keycloak.pod keycloak.container keycloak-db.container keycloak-db.volume keycloak-data.volume; do
              test -f "/usr/share/containers/systemd/$f" || { echo "missing $f"; exit 1; }
            done
            echo "quadlet units present"
            mkdir -p /tmp/normal /tmp/early /tmp/late
            /usr/lib/systemd/system-generators/podman-system-generator /tmp/normal /tmp/early /tmp/late
            ls /tmp/normal | grep -q keycloak.service || { echo "keycloak.service not generated"; exit 1; }
            ls /tmp/normal | grep -q keycloak-db.service || { echo "keycloak-db.service not generated"; exit 1; }
            echo "keycloak systemd services generated"
          '
          buildah rm "$ctr"

      - name: Push the edge/latest image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY@L}"
          buildah push immutabletesting:latest docker://$IMAGE:latest

      - name: Push a versioned image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY@L}"
          VER="${{ github.ref_name }}"
          VER="${VER//\//_}"
          echo "Pushing $IMAGE:$VER"
          buildah push immutabletesting:latest docker://$IMAGE:$VER