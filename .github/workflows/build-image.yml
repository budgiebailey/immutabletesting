name: build-image

on:
  push:
    branches:
      - main
    tags:
      - "*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the bootc image with buildah
        # bootc images must be built with buildah (not docker) to keep the OCI layout intact.
        # buildah reuses the credentials logged in above via ~/.docker/config.json.
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY@L}"
          buildah login ghcr.io -u "${{ github.actor }}" --password-stdin <<< "${{ secrets.GITHUB_TOKEN }}"
          buildah build --label io.bootc.install=1 -f Containerfile -t "$IMAGE:latest" .

      - name: Push the edge/latest image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY@L}"
          buildah push "$IMAGE:latest"

      - name: Push a versioned image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY@L}"
          VER="${{ github.ref_name }}"
          VER="${VER//\//_}"
          echo "Pushing $IMAGE:$VER"
          buildah tag "$IMAGE:latest" "$IMAGE:$VER"
          buildah push "$IMAGE:$VER"